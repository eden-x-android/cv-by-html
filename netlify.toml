[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# `netlify dev`: proxy Vite on :5173 through :8888 so the edge gate and
# /api/* functions run locally too.
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# SPA fallback. Existing files (e.g. /login/index.html) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
