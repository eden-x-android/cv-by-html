<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Toan Thai</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container" id="cv-container">
        <div id="loading-message" style="text-align: center; padding: 2rem; font-size: 1.2rem;">
            Loading CV data...
        </div>
    </div>

    <script>
        // Calculate years of experience
        function calculateYearsOfExperience() {
            const currentYear = new Date().getFullYear();
            return currentYear - 2021; // Started in 2021
        }

        // Render the CV with data from JSON
        async function renderCV() {
            try {
                const response = await fetch('./cv-data.json');
                const data = await response.json();
                
                const container = document.getElementById('cv-container');
                container.innerHTML = `
                    <div class="personal-infor">
                        <div class="name-and-image">
                            <div class="name-flex">
                                <h1>${data.personalInfo.name}</h1>
                                <div class="job-title">${data.personalInfo.jobTitle}</div>
                                <div class="contact-info">
                                    ${data.personalInfo.email ? `
                                        <a href="mailto:${data.personalInfo.email}" class="contact-info-item">
                                            <span>${data.personalInfo.email}</span>
                                        </a>
                                    ` : ''}
                                    ${data.personalInfo.email && data.personalInfo.phone ? '<a class="contact-info-item"><span> | </span></a>' : ''}
                                    ${data.personalInfo.phone ? `
                                        <a href="tel:${data.personalInfo.phone}" class="contact-info-item">
                                            <span>${data.personalInfo.phone}</span>
                                        </a>
                                    ` : ''}
                                    ${(data.personalInfo.email || data.personalInfo.phone) && data.personalInfo.address ? '<a class="contact-info-item"><span> | </span></a>' : ''}
                                    ${data.personalInfo.address ? `
                                        <a class="contact-info-item">
                                            <span>${data.personalInfo.address}</span>
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                            ${data.personalInfo.avatar ? `
                                <div class="image-flex">
                                    <img class="avatar" src="${data.personalInfo.avatar}" alt="Avatar">
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Summary Section -->
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">SUMMARY</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="additional-section">
                                <div class="additional-item">
                                    <div class="additional-detail">
                                        <p>${data.summary.replace(/\d+/, calculateYearsOfExperience())}</p>
                                    </div>
                                </div>
                                <div class="contact-info-vertical-align">
                                    ${data.socials.linkedin ? `
                                        <a href="${data.socials.linkedin}" class="contact-info-item-vertical-align">
                                            <img src="./images/ic_linkedin.svg" alt="LinkedIn" />
                                            <span>${data.socials.linkedin.replace('https://', '')}</span>
                                        </a>
                                    ` : ''}
                                    ${data.socials.github ? `
                                        <a href="${data.socials.github}" class="contact-info-item-vertical-align">
                                            <img src="./images/ic_github.svg" alt="GitHub" />
                                            <span>${data.socials.github.replace('https://', '')}</span>
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Experience Section -->
                    ${data.sectionSettings?.experience ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">RELEVANT EXPERIENCE</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="additional-section">
                                ${data.experience.map(exp => `
                                    <div class="experience-item">
                                        <div class="company-title">
                                            ${exp.title} <span class="company-name">at ${exp.company}</span>
                                        </div>
                                        <p class="date">${exp.date} // ${exp.location}</p>
                                        <ul class="experience-item-details">
                                            ${exp.details.map(detail => `<li>${detail}</li>`).join('')}
                                        </ul>
                                    </div>
                                    ${exp.pageBreakAfter ? '<div class="page-break"></div>' : ''}
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Projects Section -->
                    ${data.sectionSettings?.projects ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="additional-header">PROJECTS</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="additional-section">
                                ${data.projects.map(project => `
                                    <div class="additional-item">
                                        <div class="project-title">${project.name}</div>
                                        <ul class="experience-item-details">
                                            ${project.details.map(detail => `<li>${detail}</li>`).join('')}
                                        </ul>
                                    </div>
                                    ${project.pageBreak || project.pageBreakAfter ? '<div class="page-break"></div>' : ''}
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Education Section -->
                    ${data.sectionSettings?.education ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">EDUCATION</div>
                            </div>
                        </div>
                        <div class="right">
                            ${data.education.map(edu => `
                                <div class="additional-item">
                                    <div class="additional-title">${edu.school}</div>
                                    <div class="date">${edu.date} // ${edu.location}</div>
                                    <div class="additional-detail">${edu.degree}</div>
                                </div>
                                ${edu.pageBreakAfter ? '<div class="page-break"></div>' : ''}
                            `).join('')}
                        </div>
                    </div>

                    <!-- Skills Section -->
                    ${data.sectionSettings?.skills ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">SKILLS</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="skill-section">
                                ${data.skills.map(skill => `
                                    <div class="skill-item-container">
                                        <div class="skill-item">${skill}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Tools Section -->
                    ${data.sectionSettings?.tools ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">TOOLS</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="skill-section">
                                ${data.tools.map(tool => `
                                    <div class="skill-item-container">
                                        <div class="skill-item">${tool}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Languages Section -->
                    ${data.sectionSettings?.languages ? '<div class="page-break"></div>' : ''}
                    <div class="detail-infor">
                        <div class="left">
                            <div class="additional-section">
                                <div class="experience-header">LANGUAGES</div>
                            </div>
                        </div>
                        <div class="right">
                            <div class="skill-section">
                                ${data.languages.map(lang => `
                                    <div class="skill-item-container">
                                        <div class="skill-item">${lang}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading CV data:', error);
                document.getElementById('cv-container').innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: red;">
                        <h2>Error loading CV data</h2>
                        <p>Please make sure you're running this from a local server.</p>
                        <p>Try: <code>python -m http.server 8000</code></p>
                    </div>
                `;
            }
        }

        // Load CV data when page loads
        renderCV();
    </script>
</body>

</html>
